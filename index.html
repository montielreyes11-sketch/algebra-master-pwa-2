<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Álgebra Master</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Mi plan</p>
      <h1>Álgebra Master</h1>
    </div>
    <button id="themeToggle" class="icon-button" type="button" aria-label="Cambiar tema">🌙</button>
  </header>

  <main>
    <section class="hero card">
      <div class="progress-head">
        <div>
          <p class="eyebrow">Progreso general</p>
          <strong id="progressText">0% completado</strong>
        </div>
        <span id="progressCount">0/12</span>
      </div>
      <div class="progress-track" aria-label="Progreso general">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </section>

    <section>
      <h2>Plan de 12 semanas</h2>
      <div id="weekList" class="week-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
